name: Check

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - README.md
      - AGENTS.md
      - ".agents/**"
      - "docs/**"
  pull_request:
    paths-ignore: *docs
  workflow_call:
    outputs:
      version:
        description: The version in mygo.json, which the checked build reports.
        value: ${{ jobs.check.outputs.version }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.15.0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Wrapper actions for actionlint skip the provenance check.
      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=go depName=github.com/rhysd/actionlint
          ACTIONLINT_VERSION: v1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          gh release download "$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "${archive##*/}" --output "$archive"
          gh attestation verify "$archive" --repo rhysd/actionlint
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # Without shellcheck, actionlint skips run scripts silently.
          command -v shellcheck
          "$RUNNER_TEMP/actionlint"
      # Findings fail the job instead of going to the Security tab.
      - uses: zizmorcore/zizmor-action@v0.8.0
        with:
          advanced-security: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  check:
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      version: ${{ steps.app.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: |
          test "$(uname -m)" = arm64
          go tool mygo vet .
      - name: Test
        # MyGo's vet step already runs go vet over every package.
        run: go test -race -vet=off ./...
      - name: Build the app
        id: app
        run: |
          go tool mygo build -skip-dmg
          app=build/darwin-arm64/Maskey.app
          version=$(jq -r .version mygo.json)
          ln -s "$PWD/$app/Contents/MacOS/Maskey" "$RUNNER_TEMP/mk"
          test "$("$RUNNER_TEMP/mk" --version)" = "mk version $version"
          # mygo build strips symbols, so only the strings show whether the plugin is linked.
          if strings "$app/Contents/MacOS/Maskey" | grep -q plugins/automation; then
            echo "::error::the automation plugin is linked"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
